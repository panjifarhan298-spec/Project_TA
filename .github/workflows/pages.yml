name: Deploy static page to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site/Posyandu_Desa_Tropodo/assets/js site/assets/css site/assets/img
          cp index.html site/index.html
          cp Posyandu_Desa_Tropodo/index.html site/Posyandu_Desa_Tropodo/index.html
          cp assets/css/style.css site/assets/css/style.css
          cp assets/img/logo-sidoarjo.png site/assets/img/logo-sidoarjo.png
          cp Posyandu_Desa_Tropodo/assets/js/landing.js site/Posyandu_Desa_Tropodo/assets/js/landing.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
